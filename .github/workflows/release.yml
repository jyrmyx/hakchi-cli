name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 0.1.0) when not tagging"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon; .NET cross-compiles osx-x64 fine from here.
          # (macos-13 is deprecated / often unavailable — do not use it.)
          - os: macos-14
            rid: osx-arm64
          - os: macos-14
            rid: osx-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-22.04
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          sed -i.bak -E "s#<Version>[^<]+</Version>#<Version>${V}</Version>#" hakchi-cli/hakchi-cli.csproj || true

      - name: Publish
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RIDS: ${{ matrix.rid }}
          OUT: ${{ github.workspace }}/artifacts/release
        run: |
          chmod +x scripts/publish-release.sh
          ./scripts/publish-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hakchi-cli-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
          path: artifacts/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List zips
        run: find dist -type f -name '*.zip' -ls

      - name: Attach zips to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Updates the existing release if you created it from the UI for this tag
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
