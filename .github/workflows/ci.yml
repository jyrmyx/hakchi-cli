name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hakchi.Port.slnx

      - name: Build
        run: dotnet build Hakchi.Port.slnx -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Hakchi.Cli.Tests/Hakchi.Cli.Tests.csproj \
            -c Release \
            --no-restore \
            --verbosity normal

      - name: CLI help smoke
        run: |
          dotnet run --project hakchi-cli/hakchi-cli.csproj -c Release --no-build -- --help
          dotnet run --project hakchi-cli/hakchi-cli.csproj -c Release --no-build -- add-game --help
